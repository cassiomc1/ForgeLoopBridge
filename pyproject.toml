[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bridge"
version = "4.0.0"
description = "High-reliability multi-agent bridge and MCP communication hub for orders, executions, channels, transfers, and wakes"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "pydantic>=2.9.2",
    "uvicorn[standard]>=0.30.6",
]

[tool.setuptools]
include-package-data = true
py-modules = ["main", "self_improvement"]

[tool.setuptools.packages.find]
include = ["bridge_protocol*", "bridge_hub*", "static*", "prompts*"]

[tool.setuptools.package-data]
static = ["index.html", "vendor/*.js"]
prompts = ["*.md"]
bridge_hub = ["*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
