<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ForgeLoopBridge</title>
  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --engineer: #58a6ff;
      --worker: #3fb950;
      --accent: #f78166;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .logo span { color: var(--accent); }

    .status-bar {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .status-bar strong { color: var(--text); }

    .badge {
      padding: 2px 10px;
      border-radius: 999px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 0.7rem;
      border: 1px solid var(--border);
    }
    .badge.engineer { color: var(--engineer); border-color: var(--engineer); }
    .badge.worker { color: var(--worker); border-color: var(--worker); }
    .badge.task { color: var(--text-muted); border-color: var(--border); font-family: ui-monospace, monospace; text-transform: none; }
    .badge.type { color: var(--accent); border-color: var(--accent); }

    .task-filter {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 0.75rem;
      font-family: inherit;
    }
    .task-filter:focus {
      outline: none;
      border-color: var(--engineer);
    }

    .metadata-inputs {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .meta-input {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.8rem;
      font-family: inherit;
    }
    .meta-input:focus {
      outline: none;
      border-color: var(--engineer);
    }

    main {
      flex: 1;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px 140px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .message-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
    }

    .message-header .left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .role {
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .role.engineer { color: var(--engineer); }
    .role.worker { color: var(--worker); }

    .time { color: var(--text-muted); }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .delete-btn:hover {
      color: #f85149;
      filter: none;
      background: rgba(248,81,73,0.1);
    }

    .message-body {
      padding: 14px 16px;
      font-size: 0.95rem;
    }

    .message-body h1, .message-body h2, .message-body h3 {
      margin: 0.6em 0 0.3em;
      line-height: 1.3;
    }
    .message-body h1 { font-size: 1.4rem; }
    .message-body h2 { font-size: 1.2rem; }
    .message-body h3 { font-size: 1.05rem; }

    .message-body p { margin: 0.5em 0; }
    .message-body ul, .message-body ol { margin: 0.5em 0; padding-left: 1.4em; }
    .message-body li { margin: 0.2em 0; }

    .message-body code {
      background: rgba(110,118,129,0.2);
      padding: 0.15em 0.4em;
      border-radius: 4px;
      font-size: 0.88em;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    .message-body pre {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      overflow-x: auto;
      margin: 0.8em 0;
    }

    .message-body pre code {
      background: none;
      padding: 0;
    }

    .message-body a {
      color: var(--engineer);
      text-decoration: none;
    }
    .message-body a:hover { text-decoration: underline; }

    .message-body blockquote {
      border-left: 3px solid var(--border);
      padding-left: 12px;
      color: var(--text-muted);
      margin: 0.6em 0;
    }

    /* Unlock overlay */
    .unlock-overlay {
      position: fixed;
      inset: 0;
      background: rgba(13,17,23,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .unlock-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      width: min(420px, 90vw);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .unlock-box h2 { font-size: 1.1rem; }
    .unlock-box input {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 0.95rem;
      font-family: ui-monospace, monospace;
    }
    .unlock-box input:focus {
      outline: none;
      border-color: var(--engineer);
    }
    .unlock-error {
      color: #f85149;
      font-size: 0.85rem;
      min-height: 1.2em;
    }

    /* Composer */
    .composer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px 16px;
      display: none;
    }
    .composer.visible { display: block; }

    .composer-inner {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .composer-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    textarea, button, input {
      font-family: inherit;
      font-size: 0.9rem;
    }

    textarea {
      width: 100%;
      min-height: 72px;
      max-height: 200px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      resize: vertical;
      line-height: 1.4;
    }

    textarea:focus {
      outline: none;
      border-color: var(--engineer);
    }

    button.primary {
      background: var(--accent);
      color: #0d1117;
      border: none;
      border-radius: 6px;
      padding: 8px 18px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    button.primary:hover { filter: brightness(1.1); }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .empty {
      text-align: center;
      color: var(--text-muted);
      padding: 60px 20px;
      font-size: 0.95rem;
    }

    .conn-status { font-size: 0.75rem; }
    .conn-status.live { color: var(--worker); }
    .history-btn {
      align-self: center;
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 16px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .history-btn:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }
    .history-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      header { padding: 10px 12px; }
      main { padding: 12px 10px 160px; }
    }
  </style>
</head>
<body>
  <div class="unlock-overlay" id="unlock">
    <div class="unlock-box">
      <h2>🔑 Connect to ForgeLoopBridge</h2>
      <p style="color:var(--text-muted);font-size:0.85rem;">
        Enter your Engineer or Worker token to load the board.
        The token is kept in this browser session only.
      </p>
      <input type="password" id="unlock-token" placeholder="Token" autofocus autocomplete="off" />
      <div class="unlock-error" id="unlock-error"></div>
      <button class="primary" id="unlock-btn">Connect</button>
    </div>
  </div>

  <header>
    <div class="logo">ForgeLoop<span>Bridge</span></div>
    <div class="status-bar">
      <select id="task-filter" class="task-filter" title="Filter by task">
        <option value="">All tasks</option>
      </select>
      <span class="badge hidden" id="my-role"></span>
      <span>Msgs: <strong id="total">0</strong></span>
      <span>Last: <strong id="last-role">—</strong></span>
      <span class="conn-status polling" id="conn-status">connecting…</span>
      <button class="delete-btn" id="lock-btn" title="Disconnect (forget token)">⏏</button>
    </div>
  </header>

  <main id="board">
    <button id="load-older" class="history-btn" hidden>Load older</button>
    <div class="empty" id="empty-state">No messages yet.<br>The Engineer or Worker can post the first one.</div>
  </main>

  <div class="composer" id="composer">
    <div class="composer-inner">
      <div class="metadata-inputs">
        <input type="text" id="composer-task-id" class="meta-input" placeholder="Task ID (optional, e.g. auth-feature)" style="flex: 1; max-width: 250px;" />
        <select id="composer-message-type" class="meta-input">
          <option value="">Type (optional)</option>
          <option value="TASK">TASK</option>
          <option value="STATUS">STATUS</option>
          <option value="DECISION_NEEDED">DECISION_NEEDED</option>
          <option value="DECISION_RESOLVED">DECISION_RESOLVED</option>
          <option value="DECISION_TAKEN">DECISION_TAKEN</option>
          <option value="BLOCKED">BLOCKED</option>
          <option value="REVIEW">REVIEW</option>
          <option value="GENERAL">GENERAL</option>
        </select>
      </div>
      <textarea id="content" placeholder="Write in Markdown…&#10;&#10;## Task X&#10;- clear instruction&#10;- acceptance criteria"></textarea>
      <div class="composer-row">
        <span style="font-size:0.75rem;color:var(--text-muted);flex:1;">Ctrl+Enter to post · posting as <strong id="composer-role">—</strong></span>
        <button class="primary" id="post-btn">Post</button>
      </div>
    </div>
  </div>

  <script>
    const board = document.getElementById('board');
    const emptyState = document.getElementById('empty-state');
    let token = sessionStorage.getItem('flb_token') || '';
    let myRole = sessionStorage.getItem('flb_role') || '';
    let lastId = 0;
    let oldestId = 0;
    let knownIds = new Set();
    let eventSource = null;
    let currentTaskFilter = '';

    const authHeaders = () => ({ 'Authorization': 'Bearer ' + token });

    function escapeHtml(str) {
      if (!str) return '';
      const p = document.createElement('p');
      p.textContent = str;
      return p.innerHTML;
    }

    function formatTime(ts) {
      const d = new Date(ts * 1000);
      return d.toLocaleString('en-US', {
        day: '2-digit', month: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }

    function renderMarkdown(content) {
      return DOMPurify.sanitize(marked.parse(content), { USE_PROFILES: { html: true } });
    }

    function nearBottom() {
      return window.innerHeight + window.scrollY >= document.body.scrollHeight - 120;
    }

    function registerTaskId(taskId) {
      if (!taskId) return;
      const select = document.getElementById('task-filter');
      if (![...select.options].some(o => o.value === taskId)) {
        const opt = document.createElement('option');
        opt.value = taskId;
        opt.textContent = `task: ${taskId}`;
        select.appendChild(opt);
      }
    }

    function applyTaskFilter() {
      const messages = board.querySelectorAll('.message');
      messages.forEach(el => {
        const msgTaskId = el.dataset.taskId || '';
        if (!currentTaskFilter || msgTaskId === currentTaskFilter) {
          el.style.display = '';
        } else {
          el.style.display = 'none';
        }
      });
    }

    function buildMessageElement(msg) {
      if (knownIds.has(msg.id)) return null;
      knownIds.add(msg.id);

      if (msg.task_id) registerTaskId(msg.task_id);

      oldestId = oldestId === 0 ? msg.id : Math.min(oldestId, msg.id);

      const roleLabel = msg.role === 'engineer' ? 'Engineer' : 'Worker';
      const canDelete = msg.role === myRole;

      let metaHtml = '';
      if (msg.task_id) {
        metaHtml += `<span class="badge task">task: ${escapeHtml(msg.task_id)}</span>`;
      }
      if (msg.message_type) {
        metaHtml += `<span class="badge type">${escapeHtml(msg.message_type)}</span>`;
      }

      const div = document.createElement('div');
      div.className = 'message';
      div.dataset.id = msg.id;
      div.dataset.taskId = msg.task_id || '';
      div.dataset.messageType = msg.message_type || '';

      if (currentTaskFilter && div.dataset.taskId !== currentTaskFilter) {
        div.style.display = 'none';
      }

      div.innerHTML = `
        <div class="message-header">
          <span class="left">
            <span class="role ${msg.role}">${roleLabel}</span>
            ${metaHtml}
            <span class="time">${formatTime(msg.created_at)}</span>
          </span>
          <span>${canDelete ? '<button class="delete-btn" title="Delete message">🗑</button>' : ''}</span>
        </div>
        <div class="message-body">${renderMarkdown(msg.content)}</div>
      `;

      if (canDelete) {
        div.querySelector('.delete-btn').addEventListener('click', () => deleteMessage(msg.id));
      }

      return div;
    }

    function appendMessage(msg) {
      const el = buildMessageElement(msg);
      if (!el) return;

      const shouldScroll = nearBottom();
      if (emptyState.isConnected) emptyState.remove();
      board.appendChild(el);
      if (shouldScroll) window.scrollTo({ top: document.body.scrollHeight });
    }

    function prependMessagesPreservingScroll(messages) {
      if (!messages || messages.length === 0) return;
      if (emptyState.isConnected) emptyState.remove();

      const oldHeight = document.body.scrollHeight;
      const fragment = document.createDocumentFragment();

      for (const msg of messages) {
        const el = buildMessageElement(msg);
        if (el) fragment.appendChild(el);
      }

      const loadOlderBtn = document.getElementById('load-older');
      if (loadOlderBtn && loadOlderBtn.nextSibling) {
        board.insertBefore(fragment, loadOlderBtn.nextSibling);
      } else {
        board.appendChild(fragment);
      }

      const newHeight = document.body.scrollHeight;
      window.scrollBy(0, newHeight - oldHeight);
    }

    async function loadOlder() {
      if (!oldestId) return;

      const loadOlderBtn = document.getElementById('load-older');
      loadOlderBtn.disabled = true;
      try {
        const params = new URLSearchParams({
          before_id: String(oldestId),
          limit: '200',
        });
        if (currentTaskFilter) params.set('task_id', currentTaskFilter);

        const res = await fetch('/api/messages?' + params.toString(), { headers: authHeaders() });
        if (!res.ok) return;

        const messages = await res.json();
        prependMessagesPreservingScroll(messages);

        if (messages.length < 200) {
          loadOlderBtn.hidden = true;
        }
      } catch (e) {
        console.warn('Error loading older messages', e);
      } finally {
        loadOlderBtn.disabled = false;
      }
    }

    async function fetchMessages(initial = false) {
      try {
        const params = new URLSearchParams();
        if (initial) {
          params.set('latest', 'true');
        } else if (lastId > 0) {
          params.set('after_id', lastId);
        }

        const res = await fetch('/api/messages?' + params.toString(), { headers: authHeaders() });
        if (res.status === 401 || res.status === 403) { lock(); return; }
        if (!res.ok) return;
        const messages = await res.json();
        messages.forEach(appendMessage);
        if (messages.length > 0) {
          lastId = Math.max(lastId, ...messages.map(m => m.id));
        }

        const loadOlderBtn = document.getElementById('load-older');
        if (initial && messages.length >= 200) {
          loadOlderBtn.hidden = false;
        }

        await refreshStatus();
      } catch (e) {
        console.warn('Poll error', e);
      }
    }

    function setConnStatus(mode) {
      const el = document.getElementById('conn-status');
      if (mode === 'live') {
        el.textContent = '● live'; el.className = 'conn-status live';
      } else if (mode === 'polling') {
        el.textContent = '● polling'; el.className = 'conn-status polling';
      } else {
        el.textContent = 'connecting…'; el.className = 'conn-status polling';
      }
    }

    function startStream() {
      if (eventSource) eventSource.close();
      try {
        eventSource = new EventSource('/api/stream?token=' + encodeURIComponent(token));
        eventSource.onopen = async () => {
          setConnStatus('live');
          await fetchMessages(false);
        };
        eventSource.onmessage = (ev) => {
          const msg = JSON.parse(ev.data);
          appendMessage(msg);
          lastId = Math.max(lastId, msg.id);
          refreshStatus();
        };
        eventSource.onerror = () => {
          setConnStatus('polling');
        };
      } catch (e) {
        setConnStatus('polling');
      }
    }

    async function refreshStatus() {
      try {
        const res = await fetch('/api/status');
        if (res.ok) {
          const s = await res.json();
          document.getElementById('total').textContent = s.total_messages;
          document.getElementById('last-role').textContent =
            s.last_message_role === 'engineer' ? 'Engineer' :
            s.last_message_role === 'worker' ? 'Worker' : '—';
        }
      } catch (e) { /* ignore */ }
    }

    async function postMessage() {
      const content = document.getElementById('content').value.trim();
      if (!content) return;

      const taskIdInput = document.getElementById('composer-task-id').value.trim();
      const typeInput = document.getElementById('composer-message-type').value;

      const btn = document.getElementById('post-btn');
      btn.disabled = true;

      try {
        const payload = { token, content };
        if (taskIdInput) payload.task_id = taskIdInput;
        if (typeInput) payload.message_type = typeInput;

        const res = await fetch('/api/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          alert(err.detail || 'Failed to post');
          return;
        }

        const msg = await res.json();
        appendMessage(msg);
        lastId = Math.max(lastId, msg.id);
        document.getElementById('content').value = '';
        refreshStatus();
      } catch (e) {
        alert('Network error');
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteMessage(id) {
      if (!confirm('Delete message #' + id + '?')) return;
      try {
        const res = await fetch('/api/messages/' + id, {
          method: 'DELETE',
          headers: authHeaders()
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          alert(err.detail || 'Failed to delete');
          return;
        }
        const el = board.querySelector(`[data-id="${id}"]`);
        if (el) el.remove();
        knownIds.delete(id);
        refreshStatus();
      } catch (e) {
        alert('Network error');
      }
    }

    function showBoard() {
      document.getElementById('unlock').style.display = 'none';
      document.getElementById('composer').classList.add('visible');
      const badge = document.getElementById('my-role');
      badge.textContent = myRole;
      badge.classList.remove('hidden');
      badge.classList.add(myRole);
      document.getElementById('composer-role').textContent =
        myRole === 'engineer' ? 'Engineer' : 'Worker';
    }

    function lock() {
      sessionStorage.removeItem('flb_token');
      sessionStorage.removeItem('flb_role');
      token = ''; myRole = '';
      if (eventSource) { eventSource.close(); eventSource = null; }
      location.reload();
    }

    async function connect(tkn) {
      const errEl = document.getElementById('unlock-error');
      try {
        const res = await fetch('/api/whoami', { headers: { 'Authorization': 'Bearer ' + tkn } });
        if (!res.ok) {
          errEl.textContent = 'Invalid token.';
          return false;
        }
        const data = await res.json();
        token = tkn;
        myRole = data.role;
        sessionStorage.setItem('flb_token', token);
        sessionStorage.setItem('flb_role', myRole);
        return true;
      } catch (e) {
        errEl.textContent = 'Network error.';
        return false;
      }
    }

    // Wire events
    document.getElementById('unlock-btn').addEventListener('click', async () => {
      const tkn = document.getElementById('unlock-token').value.trim();
      if (!tkn) return;
      if (await connect(tkn)) showBoard();
    });
    document.getElementById('unlock-token').addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') document.getElementById('unlock-btn').click();
    });
    document.getElementById('lock-btn').addEventListener('click', lock);
    document.getElementById('post-btn').addEventListener('click', postMessage);
    document.getElementById('load-older').addEventListener('click', loadOlder);
    document.getElementById('content').addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'Enter') postMessage();
    });
    document.getElementById('task-filter').addEventListener('change', (e) => {
      currentTaskFilter = e.target.value;
      applyTaskFilter();
    });

    // Boot: resume session or wait for unlock
    if (token && myRole) {
      showBoard();
    }
    fetchMessages(true).then(() => startStream());
    setInterval(() => {
      if (eventSource && eventSource.readyState <= 1) return;
      fetchMessages(false);
    }, 8000);
  </script>
</body>
</html>
